name: Build patched OmniRoute release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream OmniRoute version without the v prefix
        required: true
        type: string
      patch_revision:
        description: Overlay artifact revision
        required: false
        default: "1"
        type: string
      upstream_ref:
        description: Upstream tag or branch; baseline pin is used when omitted for the baseline version
        required: false
        default: ""
        type: string
      upstream_commit:
        description: Optional exact 40-character upstream commit pin
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: patched-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      PATCH_REVISION: ${{ inputs.patch_revision }}
      INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
      INPUT_UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
      JWT_SECRET: ci-build-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      API_KEY_SECRET: ci-build-api-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      INITIAL_PASSWORD: ci-only-password
      REQUIRE_API_KEY: "true"
      AUTH_COOKIE_SECURE: "false"
      OMNIROUTE_DISABLE_BACKGROUND_SERVICES: "true"
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      OMNIROUTE_BUILD_MEMORY_MB: "6144"
      OMNIROUTE_USE_TURBOPACK: "0"

    steps:
      - uses: actions/checkout@v5

      - name: Check public overlay hygiene
        run: bash scripts/check-public-hygiene.sh

      - name: Resolve upstream source
        run: |
          set -euo pipefail
          BASELINE_VERSION=$(node -p "require('./config/baseline.json').upstreamVersion")
          BASELINE_REF=$(node -p "require('./config/baseline.json').upstreamRef")
          BASELINE_COMMIT=$(node -p "require('./config/baseline.json').upstreamCommit")

          UPSTREAM_REF="$INPUT_UPSTREAM_REF"
          UPSTREAM_COMMIT="$INPUT_UPSTREAM_COMMIT"
          if [ "$VERSION" = "$BASELINE_VERSION" ] && [ -z "$UPSTREAM_REF" ] && [ -z "$UPSTREAM_COMMIT" ]; then
            UPSTREAM_REF="$BASELINE_REF"
            UPSTREAM_COMMIT="$BASELINE_COMMIT"
          fi
          if [ -z "$UPSTREAM_REF" ] && [ -z "$UPSTREAM_COMMIT" ]; then
            UPSTREAM_REF="v${VERSION}"
          fi

          if [ -n "$UPSTREAM_COMMIT" ] && ! [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid upstream commit: $UPSTREAM_COMMIT" >&2
            exit 1
          fi

          echo "UPSTREAM_REF=$UPSTREAM_REF" >> "$GITHUB_ENV"
          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "Resolved upstream source: ref=${UPSTREAM_REF:-none} commit=${UPSTREAM_COMMIT:-none}"

      - name: Clone exact upstream source
        run: |
          set -euo pipefail
          if [ -n "$UPSTREAM_COMMIT" ]; then
            git init upstream
            git -C upstream remote add origin https://github.com/diegosouzapw/OmniRoute.git
            git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT"
            git -C upstream checkout --detach FETCH_HEAD
          else
            git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/diegosouzapw/OmniRoute.git upstream
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Verify exact version
        run: |
          test "$(node -p "require('./upstream/package.json').version")" = "$VERSION"
          ACTUAL_COMMIT=$(git -C upstream rev-parse HEAD)
          if [ -n "$UPSTREAM_COMMIT" ]; then test "$ACTUAL_COMMIT" = "$UPSTREAM_COMMIT"; fi
          echo "UPSTREAM_SOURCE=${UPSTREAM_REF:-detached}@$ACTUAL_COMMIT"

      - name: Apply source overlay
        run: bash scripts/apply-patch.sh upstream

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Lint overlay handlers
        working-directory: upstream
        run: >-
          ./node_modules/.bin/eslint
          open-sse/handlers/imageGeneration/providers/cloudflareWorkersAi.ts
          open-sse/handlers/imageGeneration/providers/aiHorde.ts
          tests/unit/cloudflare-workers-ai-image.test.ts
          tests/unit/aihorde-image.test.ts

      - name: Test image overlay adapters
        working-directory: upstream
        run: >-
          node --import tsx/esm --test
          tests/unit/cloudflare-workers-ai-image.test.ts
          tests/unit/aihorde-image.test.ts

      - name: Test GPT-5.6 Responses normalization
        working-directory: upstream
        run: >-
          node --import tsx/esm
          --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts
          --test --test-force-exit
          tests/unit/responses-translation-fixes.test.ts

      - name: Install Chromium
        working-directory: upstream
        run: npx playwright install --with-deps chromium

      - name: Report runner resources
        run: |
          nproc
          free -h
          df -h "$GITHUB_WORKSPACE"
          node --version

      - name: Build Next release
        timeout-minutes: 35
        working-directory: upstream
        run: |
          rm -rf .build dist
          export OMNIROUTE_BUILD_SHA="$(git rev-parse --short HEAD)"
          timeout --signal=TERM --kill-after=2m 33m npm run build

      - name: Build CLI release
        timeout-minutes: 15
        working-directory: upstream
        run: |
          export OMNIROUTE_BUILD_SHA="$(git rev-parse --short HEAD)"
          timeout --signal=TERM --kill-after=2m 13m npm run build:cli
          node scripts/build/write-build-sha.mjs

      - name: Pack npm artifact
        id: pack
        run: |
          mkdir -p artifacts
          FILE=$(cd upstream && npm pack --pack-destination ../artifacts --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          tar -tzf "artifacts/$FILE" | grep -q '^package/dist/'

      - name: Install packed artifact
        run: npm install --prefix smoke-root --omit=dev "./artifacts/${{ steps.pack.outputs.file }}"

      - name: Verify packed overlay markers
        run: |
          grep -Rqs 'cloudflare-workers-ai-image' smoke-root/node_modules/omniroute/dist
          grep -Rqs 'aihorde-image' smoke-root/node_modules/omniroute/dist

      - name: Preserve candidate artifact for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-${{ inputs.version }}-overlay-${{ inputs.patch_revision }}-candidate
          path: artifacts/${{ steps.pack.outputs.file }}
          retention-days: 3

      - name: Test packaged launcher and dashboard
        run: cp tests/packaged-smoke.mjs upstream/.patched-packaged-smoke.mjs && node upstream/.patched-packaged-smoke.mjs "$GITHUB_WORKSPACE/smoke-root/node_modules/omniroute"

      - name: Create release manifest and checksum
        run: |
          node scripts/make-manifest.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE/artifacts/${{ steps.pack.outputs.file }}" "$GITHUB_WORKSPACE/artifacts/manifest.json"
          cd artifacts
          sha256sum "${{ steps.pack.outputs.file }}" manifest.json > SHA256SUMS

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-overlay.${PATCH_REVISION}"
          gh release create "$TAG" artifacts/* \
            --title "OmniRoute ${VERSION} + overlay ${PATCH_REVISION}" \
            --notes "Verified source-level overlay for ${UPSTREAM_REF:-detached} at $(git -C upstream rev-parse HEAD). Includes the configured Cloudflare Workers AI and AI Horde image adapters. Built and tested by GitHub Actions; never deploys automatically."

      - name: Close matching incompatibility issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search "OmniRoute ${VERSION} patch compatibility" --json number --jq '.[].number' | xargs -r -n1 gh issue close --comment "Verified overlay release published successfully."

  report-failure:
    if: failure()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="OmniRoute ${VERSION} patch compatibility"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="The automated overlay release did not pass all gates. Production was not touched. Inspect: ${RUN_URL}"
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
